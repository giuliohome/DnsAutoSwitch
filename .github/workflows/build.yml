name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Publish (self-contained, single file)
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\DnsAutoSwitch.exe, publish\appsettings.example.json -DestinationPath DnsAutoSwitch-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DnsAutoSwitch-win-x64
          path: DnsAutoSwitch-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DnsAutoSwitch-win-x64.zip
